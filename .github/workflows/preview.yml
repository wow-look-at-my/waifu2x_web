name: Deploy PR previews

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# id-token lets buildhost-publish-site authenticate to buildhost via OIDC (no static secret); deployments and artifact-metadata let it record the release. pull-requests is for the preview URL comment it leaves on the PR.
permissions:
  contents: read
  id-token: write
  deployments: write
  artifact-metadata: write
  pull-requests: write

jobs:
  build:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node build.mjs

  # The deploy job builds its own copy of the site. The artifact-storage route the preview used to take is gone, so the job that publishes cannot wait on another job's workspace. Each PR writes to its own buildhost branch, so a newer push replaces the previous preview atomically.
  deploy-preview:
    needs: build
    if: always() && github.event.action != 'closed'
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node build.mjs
      - name: Publish preview to buildhost
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-site@lkgb
        with:
          server: https://pazer.build
          project: waifu2x_web
          branch: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
          source_dir: build
          public: true
