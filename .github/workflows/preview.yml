name: Deploy PR previews

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: write
  pages: write
  pull-requests: write
  statuses: write
  id-token: write

jobs:
  build:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: wow-look-at-my/actions@cached-apt#latest
        with:
          packages: just
      - run: npm ci

      # The Chromium build that playwright-core pins is cached. Its system libraries install each run.
      - uses: wow-look-at-my/actions@cached-run#latest
        with:
          paths: ~/.cache/ms-playwright
          run: |
            # ${{ hashFiles('package-lock.json') }}
            npx playwright-core install chromium
      - run: npx playwright-core install-deps chromium

      - run: just check
      - run: just test
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: ./build/

  deploy-preview:
    needs: build
    if: always()
    uses: PazerOP/pr-preview-action/.github/workflows/preview.yml@master
    with:
      artifact-name: build
    secrets: inherit
