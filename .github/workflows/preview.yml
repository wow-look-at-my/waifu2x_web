name: Deploy PR previews

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pages: write
  pull-requests: write
  statuses: write
  id-token: write

jobs:
  build:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: ./build/

  deploy-preview:
    needs: build
    if: always()
    uses: PazerOP/pr-preview-action/.github/workflows/preview.yml@master
    with:
      artifact-name: build
    secrets: inherit
