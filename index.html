<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self';">
    <title>waifu2x - Client-Side Image Upscaler</title>
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <canvas id="gl-canvas" width="1" height="1" hidden></canvas>

    <header>
        <h1>waifu2x</h1>
        <p class="subtitle">Client-side 2x / 4x image upscaling powered by WebGL2</p>
    </header>

    <main>
        <div id="init-section">
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="model-progress-fill"></div>
            </div>
        </div>

        <div id="controls-section" hidden>
            <div class="options-row">
                <label>
                    Noise reduction
                    <select id="noise-level">
                        <option value="none">None (upscale only)</option>
                        <option value="1">Low</option>
                        <option value="2" selected>Medium</option>
                        <option value="3">High</option>
                    </select>
                </label>
                <label>
                    Scale
                    <select id="scale-select">
                        <option value="2">2x</option>
                        <option value="4">4x</option>
                    </select>
                </label>
                <span id="dim-info"></span>
            </div>

            <div class="action-row">
                <button id="process-btn" disabled>Upscale 2x</button>
                <button id="download-btn" hidden>Download PNG</button>
            </div>

            <div id="progress-section" hidden>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
            </div>
        </div>

        <div id="status-text">Loading...</div>
    </main>

    <div id="preview-section">
        <div class="preview-grid">
            <div class="preview-col">
                <div class="preview-label">Original</div>
                <div class="preview-img-wrap" id="drop-zone">
                    <div id="drop-content">
                        <div class="drop-icon">&#x1F5BC;</div>
                        <div>Drop image here or click to select</div>
                    </div>
                    <img id="before-img" alt="Original" class="is-hidden">
                    <input type="file" id="file-input" accept="image/*" hidden>
                </div>
            </div>
            <div class="preview-col">
                <div class="preview-label">Upscaled</div>
                <div class="preview-img-wrap" id="upscaled-wrap">
                    <img id="after-img" alt="Upscaled" class="is-hidden">
                </div>
            </div>
        </div>
    </div>

    <div id="magnifier" hidden></div>

    <footer>
        All processing runs locally in your browser. No data leaves this page.
    </footer>

    <script type="module" src="js/app.js?v=2"></script>
</body>
</html>
